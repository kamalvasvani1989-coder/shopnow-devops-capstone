apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: shopnow
  labels: { app: admin }
spec:
  replicas: 1                    # no HPA for admin
  selector: { matchLabels: { app: admin } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: admin } }
    spec:
      containers:
        - name: admin
          image: __REGISTRY__/shopnow-admin:__TAG__
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: shopnow
  labels: { app: admin }
spec:
  type: ClusterIP                # reach with: kubectl -n shopnow port-forward svc/admin 8082:80
  selector: { app: admin }
  ports: [{ name: http, port: 80, targetPort: http }]
