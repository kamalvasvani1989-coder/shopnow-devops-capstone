apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopnow
  labels: { app: frontend }
spec:
  # No replicas field: the HPA owns the replica count.
  selector: { matchLabels: { app: frontend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: __REGISTRY__/shopnow-frontend:__TAG__
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopnow
  labels: { app: frontend }
spec:
  type: LoadBalancer             # the ONLY public entry point (one Classic LB)
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
