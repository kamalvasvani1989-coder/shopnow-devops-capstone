- name: node_exporter system user
  ansible.builtin.user: { name: node_exporter, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Download node_exporter {{ node_exporter_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Install binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    mode: "0755"
  notify: restart node_exporter

- name: systemd unit
  ansible.builtin.template: { src: node_exporter.service.j2, dest: /etc/systemd/system/node_exporter.service, mode: "0644" }
  notify: restart node_exporter

- name: Enable node_exporter
  ansible.builtin.systemd: { name: node_exporter, enabled: true, state: started, daemon_reload: true }
